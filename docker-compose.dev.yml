---
services:
  web-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tfg_pool_web_dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # Ayuda al hot-reload en Windows/Mac con Docker
